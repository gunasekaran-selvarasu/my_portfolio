name: CI Quality & Build Verification

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  lint-and-build:
    name: Lint, TypeScript & Static Pre-render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: TypeScript & Production Build with Static Pre-rendering
        run: npm run build

      - name: Verify Pre-rendered Static Artifacts & Sitemap
        run: |
          echo "Verifying build outputs..."
          test -f out/index.html || { echo "Missing out/index.html"; exit 1; }
          test -f out/blog.html -o -f out/blog/index.html || { echo "Missing out/blog HTML"; exit 1; }
          test -f out/sitemap.xml || { echo "Missing out/sitemap.xml"; exit 1; }
          
          # Check that blog posts are pre-rendered
          grep -rq "Mastering AWS CloudFront" out/blog/ || { echo "Missing CloudFront pre-rendered post"; exit 1; }
          grep -rq "Architecting Resilient PostgreSQL" out/blog/ || { echo "Missing PostgreSQL pre-rendered post"; exit 1; }
          grep -rq "Achieving Sub-100ms TBT" out/blog/ || { echo "Missing TBT pre-rendered post"; exit 1; }
          
          # Check sitemap contains /blog
          grep -q "https://guna.dev/blog" out/sitemap.xml || { echo "Sitemap missing /blog"; exit 1; }
          
          echo "All static artifacts and SEO metadata verified successfully!"

  docker-build-check:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: portfolio_guna:ci-test
